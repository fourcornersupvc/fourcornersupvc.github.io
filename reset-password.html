<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغيير كلمة المرور | Four Corners</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #101010;
      color: #eee;
      font-family: Arial, sans-serif;
    }
    .panel {
      max-width: 480px;
      margin: 70px auto;
      padding: 30px;
      background: #1c1c1c;
      border: 1px solid #39332a;
      border-radius: 14px;
    }
    h2 { color: #d7b45b; text-align: center; }
    p { line-height: 1.8; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input {
      background: #292929;
      color: white;
      border: 1px solid #555;
    }
    button {
      background: #d7b45b;
      color: #111;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    #message { color: #d7b45b; }
    a { color: #d7b45b; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>تعيين كلمة مرور جديدة</h2>
    <p id="message">جاري التحقق من رابط الاستعادة...</p>

    <form id="resetForm" hidden>
      <label>كلمة المرور الجديدة</label>
      <input id="newPassword" type="password" minlength="8"
        placeholder="اكتب كلمة مرور قوية" required>
      <label>تأكيد كلمة المرور</label>
      <input id="confirmPassword" type="password" minlength="8"
        placeholder="أعد كتابة كلمة المرور" required>
      <button type="submit">حفظ كلمة المرور الجديدة</button>
    </form>

    <p><a href="https://fourcornersupvc.github.io/admin.html">العودة إلى تسجيل دخول المدير</a></p>
  </div>

  <script>
    const SUPABASE_URL = "https://cilfktroyeocuorohorz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_0S-yQSnNfZfDQOpPkt564Q_M-Pmm6D4";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      { auth: { detectSessionInUrl: true } }
    );

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");

    async function checkRecoverySession() {
      const { data, error } = await db.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابط استعادة جديد من لوحة Supabase.";
        return;
      }

      message.textContent = "تم التحقق من الرابط. اكتب كلمة المرور الجديدة.";
      form.hidden = false;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "كلمة المرور يجب ألا تقل عن 8 أحرف.";
        return;
      }

      if (password !== confirm) {
        message.textContent = "كلمتا المرور غير متطابقتين.";
        return;
      }

      message.textContent = "جاري حفظ كلمة المرور...";

      const { error } = await db.auth.updateUser({ password });

      if (error) {
        message.textContent = "تعذر تغيير كلمة المرور: " + error.message;
        return;
      }

      message.textContent =
        "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول من لوحة المدير.";
      form.hidden = true;
    });

    checkRecoverySession();
  </script>
</body>
</html>
